name: NextNudge one-thread Owner save
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: nextnudge-save-${{ github.repository }}
  cancel-in-progress: false

jobs:
  thread-save:
    if: contains(github.event.issue.labels.*.name, 'nextnudge-thread-save') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and append exactly one thread
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/nextnudge_thread_apply.mjs
