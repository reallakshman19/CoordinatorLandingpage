name: WP-L1f temporary before-after Chromium DOM comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dom-text-parity:
    name: Compare 12 main views against exact pre-split commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing browser harness prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Compare the visible DOM text from the same frozen data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import difflib
          import json
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          from playwright.sync_api import sync_playwright

          ROOT=Path.cwd()
          sys.path.insert(0,str(ROOT/'scripts'))
          sys.path.insert(0,str(ROOT/'tests'))
          import build_data
          from browser_smoke_test import find_free_port,start_server

          old="a83c8cd26e04052a1d635fda39807a7f8b5a5220"
          benchmarks=[
              ROOT/'benchmarks'/'grade9-pilot-2026-10-15',
              ROOT/'benchmarks'/'imo-ab-test-2026-10-15',
          ]
          report=[]
          with tempfile.TemporaryDirectory() as td:
              tmp=Path(td)
              left=tmp/'baseline'
              right=tmp/'candidate'
              shutil.copytree(ROOT/'site',left)
              shutil.copytree(ROOT/'site',right)
              # Change only the baseline HTML and single JS in the baseline tree.
              for name in ('index.html','app.js'):
                  blob=subprocess.check_output(['git','show',old+':site/'+name])
                  (left/name).write_bytes(blob)
              shutil.rmtree(left/'js',ignore_errors=True)
              output=tmp/'frozen'
              build_data.build_all(ROOT,output/'data',benchmark_dirs=benchmarks)
              build_data.build_all(ROOT,output/'data'/'benchmarks',benchmark_dirs=benchmarks)
              for root in (left,right):
                  shutil.copytree(output/'data',root/'data',dirs_exist_ok=True)
              project_rows=json.loads((output/'data'/'projects.json').read_text())
              assert len(project_rows)==2,project_rows
              grade=next(x for x in project_rows if x['project']=='grade9-pilot')
              imo=next(x for x in project_rows if x['project']=='imo-ab-test')
              assert grade['agents'] and imo['agents']
              routes=[
                  '#home',
                  '#status-bar',
                  '#next-moves',
                  '#project/grade9-pilot',
                  '#project/imo-ab-test',
                  '#agent/grade9-pilot/'+grade['agents'][0]['chat_id8'],
                  '#agent/imo-ab-test/'+imo['agents'][0]['chat_id8'],
                  '#timeline/grade9-pilot',
                  '#timeline/imo-ab-test',
                  '#owner-inputs',
                  '#protocol',
                  '#benchmarks',
              ]
              servers=[start_server(str(left),find_free_port()),
                       start_server(str(right),find_free_port())]
              try:
                  with sync_playwright() as pw:
                      browser=pw.chromium.launch(headless=True)
                      pages=[browser.new_page(viewport={'width':1300,'height':850})
                             for _ in range(2)]
                      pageerrors=[[],[]]
                      for k,p in enumerate(pages):
                          p.on('pageerror',lambda error,k=k:pageerrors[k].append(str(error)))
                      for route in routes:
                          observed=[]
                          for side,(p,srv) in enumerate(zip(pages,servers)):
                              u=f'http://127.0.0.1:{srv.server_address[1]}/index.html'+route
                              p.goto(u,wait_until='networkidle',timeout=30000)
                              p.wait_for_function(
                                  "document.getElementById('app') && "+
                                  "!document.getElementById('app').innerText.trim().startsWith('Loading…')",
                                  timeout=12000)
                              p.wait_for_timeout(50)
                              observed.append(p.locator('#app').inner_text())
                          a,b=observed
                          assert a.strip() and b.strip(),('empty view',route)
                          sha_a=sha256(a.encode('utf-8')).hexdigest()
                          sha_b=sha256(b.encode('utf-8')).hexdigest()
                          ok=a==b
                          entry={'route':route,'baseline_sha256':sha_a,
                                 'candidate_sha256':sha_b,
                                 'baseline_text':a,'candidate_text':b,
                                 'identical':ok}
                          report.append(entry)
                          print('DOM_TEXT_PARITY',route,sha_a,sha_b,
                                'PASS' if ok else 'FAIL',flush=True)
                          if not ok:
                              print('DOM_DIFF',route,'\n'.join(list(difflib.unified_diff(
                                  a.splitlines(),b.splitlines(),fromfile='main',tofile='split'))[:100]),
                                  flush=True)
                      assert not pageerrors[0],('baseline page errors',pageerrors[0])
                      assert not pageerrors[1],('split page errors',pageerrors[1])
                      browser.close()
              finally:
                  for srv in servers:srv.shutdown()
          Path('_dom-parity.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),
                                             encoding='utf-8',newline='\n')
          assert len(report)==12, len(report)
          assert all(x['identical'] for x in report),'visible view content drift'
          print('DOM_PARITY_TOTAL=12/12',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-l1f-dom-parity-report
          path: _dom-parity.json
          if-no-files-found: warn
