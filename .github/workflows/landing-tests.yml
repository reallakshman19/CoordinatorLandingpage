name: landing-live WP1a qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  head:
    name: head · original 31 + F3/F6 + original 19 browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unchanged 31-check benchmark suite
        id: original
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tests/build_test.py 2>&1 | tee wp1a-original.log

      - name: Run nine new F3/F6 controls at HEAD
        id: wp1a
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests/test_wp1a.py -v 2>&1 | tee wp1a-head.log

      - name: Assemble benchmark-backed browser artifact (no live API)
        id: artifact
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _artifact
          cp -r site/. _artifact/
          python scripts/build_data.py --root . --out _artifact/data \
            --benchmark benchmarks/grade9-pilot-2026-10-15 \
            --benchmark benchmarks/imo-ab-test-2026-10-15
          python scripts/build_data.py --root . --out _artifact/data/benchmarks \
            --benchmark benchmarks/grade9-pilot-2026-10-15 \
            --benchmark benchmarks/imo-ab-test-2026-10-15
          cp -r protocol/ _artifact/protocol/

      - name: Install Playwright and Chromium
        id: chromium
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run unchanged 19 browser checks
        id: browser
        if: steps.artifact.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tests/browser_smoke_test.py _artifact 2>&1 | tee wp1a-browser.log

      - name: Upload qualification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp1a-head-output
          path: |
            wp1a-original.log
            wp1a-head.log
            wp1a-browser.log
          if-no-files-found: ignore

      - name: Require all HEAD qualification gates
        if: always()
        shell: bash
        run: |
          echo "original-31=${{ steps.original.outcome }}"
          echo "new-F3-F6=${{ steps.wp1a.outcome }}"
          echo "benchmark-artifact=${{ steps.artifact.outcome }}"
          echo "chromium=${{ steps.chromium.outcome }}"
          echo "original-browser-19=${{ steps.browser.outcome }}"
          test "${{ steps.original.outcome }}" = success
          test "${{ steps.wp1a.outcome }}" = success
          test "${{ steps.artifact.outcome }}" = success
          test "${{ steps.chromium.outcome }}" = success
          test "${{ steps.browser.outcome }}" = success

  red-control:
    name: red-control · restore pinned base scripts; require F3 and F6 fail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD including F3/F6 fixtures and test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore only original scripts from pinned pre-WP1a base
        shell: bash
        run: |
          set -euo pipefail
          BASE=a3e0bf5ac8ae722eeddbd01e4959f06dd5acc8d9
          git cat-file -e "${BASE}^{commit}"
          git show "${BASE}:scripts/fetch_live_data.py" > scripts/fetch_live_data.py
          git show "${BASE}:scripts/build_data.py" > scripts/build_data.py
          echo "BASE=${BASE}"
          echo "New HEAD F3/F6 tests retained; only the two permitted scripts restored."

      - name: Execute new tests and assert meaningful expected RED
        id: red
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m unittest tests/test_wp1a.py -v > wp1a-red.log 2>&1
          rc=$?
          set -e
          cat wp1a-red.log
          export RED_EXIT="$rc"
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import sys

          output = Path('wp1a-red.log').read_text(encoding='utf-8')
          failed = re.findall(
              r'^(test_(f[36])_[A-Za-z0-9_]+)\s+\([^\n]+\)\s+\.\.\.\s+(FAIL|ERROR)$',
              output, re.MULTILINE,
          )
          print('RED CONTROL: unittest exit =', os.environ['RED_EXIT'])
          print('RED CONTROL: failing assertions or expected missing API:')
          for test, family, status in failed:
              print(f'  {family.upper()} {test}: {status}')
          observed = {family for _, family, _ in failed}
          required = {'f3', 'f6'}
          ok = (
              int(os.environ['RED_EXIT']) != 0
              and re.search(r'^Ran 9 tests in ', output, re.MULTILINE) is not None
              and 'FAILED (' in output
              and required.issubset(observed)
              and not any(err in output for err in
                          ('ModuleNotFoundError', 'SyntaxError', 'ImportError'))
          )
          print('RED CONTROL VERDICT:', 'EXPECTED RED' if ok else 'INVALID RED')
          if not ok:
              sys.exit(1)
          PY

      - name: Upload red-control output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp1a-base-red-output
          path: wp1a-red.log
          if-no-files-found: ignore
