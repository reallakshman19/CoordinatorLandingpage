name: landing-live WP1a + WP1b + WP2 + WP4 + WP3 qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  head:
    name: head · original 31 + WP1a and F5 + original 19 browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unchanged 31-check benchmark suite
        id: original
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tests/build_test.py 2>&1 | tee wp1a-original.log

      - name: Run WP1a 18 and WP1b F5 14 controls at HEAD
        id: wp1a
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests/test_wp1a.py tests/test_wp1a_behavioural.py tests/test_wp1b.py -v 2>&1 | tee wp1a-head.log

      - name: Run seven WP4 publisher source/publish-gate checks
        id: wp4
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_wp4 -v 2>&1 | tee wp4-head.log

      - name: Run WP3 F4 liveness/repository isolation tests
        id: wp3_unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_wp3 -v 2>&1 | tee wp3-unit-head.log

      - name: Assemble benchmark-backed browser artifact (no live API)
        id: artifact
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _artifact
          cp -r site/. _artifact/
          python scripts/build_data.py --root . --out _artifact/data \
            --benchmark benchmarks/grade9-pilot-2026-10-15 \
            --benchmark benchmarks/imo-ab-test-2026-10-15
          python scripts/build_data.py --root . --out _artifact/data/benchmarks \
            --benchmark benchmarks/grade9-pilot-2026-10-15 \
            --benchmark benchmarks/imo-ab-test-2026-10-15
          cp -r protocol/ _artifact/protocol/

      - name: Install Playwright and Chromium
        id: chromium
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run unchanged 19 browser checks
        id: browser
        if: steps.artifact.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tests/browser_smoke_test.py _artifact 2>&1 | tee wp1a-browser.log

      - name: Run WP2 visible browser and mobile/theme checks
        id: wp2_browser
        if: steps.artifact.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tests/wp2_browser_test.py _artifact 2>&1 | tee wp2-head.log

      - name: Run WP3 build-info polling and unchanged/changed browser checks
        id: wp3_browser
        if: steps.artifact.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tests/wp3_browser_test.py _artifact 2>&1 | tee wp3-browser-head.log

      - name: Upload qualification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp1a-head-output
          path: |
            wp1a-original.log
            wp1a-head.log
            wp1a-browser.log
            wp2-head.log
            wp4-head.log
            wp3-unit-head.log
            wp3-browser-head.log
          if-no-files-found: ignore

      - name: Prove injected failure rejected and enforce all HEAD gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # This exact function guards both the injected failure and the
          # actual continue-on-error outcomes (not masked conclusions).
          require_success() {
            local gate="$1"
            local outcome="$2"
            echo "gate $gate=$outcome"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::Required gate $gate outcome=$outcome" >&2
              return 1
            fi
          }
          # Prove fail-closed logic, do not merely assert its source exists.
          if (require_success "injected-continue-on-error-failure" "failure" > gate-negative.log 2>&1); then
            cat gate-negative.log
            echo "::error::FINAL GATE unexpectedly accepted injected failure"
            exit 1
          fi
          cat gate-negative.log
          echo "FINAL GATE SELF-TEST: injected failure -> exit 1 (REJECTED)"
          require_success "original-31" "${{ steps.original.outcome }}"
          require_success "WP1a-18-and-WP1b-F5-14" "${{ steps.wp1a.outcome }}"
          require_success "benchmark-artifact" "${{ steps.artifact.outcome }}"
          require_success "chromium" "${{ steps.chromium.outcome }}"
          require_success "original-browser-19" "${{ steps.browser.outcome }}"
          require_success "WP2-visible-browser" "${{ steps.wp2_browser.outcome }}"
          require_success "WP4-single-publisher-and-provenance" "${{ steps.wp4.outcome }}"
          require_success "WP3-liveness-repository-F4" "${{ steps.wp3_unit.outcome }}"
          require_success "WP3-browser-60s-polling" "${{ steps.wp3_browser.outcome }}"
          echo "FINAL GATE: 9/9 actual head outcomes success"

  red-control:
    name: red-control · require seven behavioural FAIL and zero ERROR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD including F3/F6 fixtures and test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore only original scripts from pinned pre-WP1a base
        shell: bash
        run: |
          set -euo pipefail
          BASE=a3e0bf5ac8ae722eeddbd01e4959f06dd5acc8d9
          git cat-file -e "${BASE}^{commit}"
          git show "${BASE}:scripts/fetch_live_data.py" > scripts/fetch_live_data.py
          git show "${BASE}:scripts/build_data.py" > scripts/build_data.py
          echo "BASE=${BASE}"
          echo "New HEAD F3/F6 tests retained; only the two permitted scripts restored."

      - name: Execute base-compatible tests and require assertion-only RED
        id: red
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m unittest tests/test_wp1a_behavioural.py -v > wp1a-red.log 2>&1
          rc=$?
          set -e
          cat wp1a-red.log
          export RED_EXIT="$rc"
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import sys

          output = Path('wp1a-red.log').read_text(encoding='utf-8')
          cases = re.findall(
              r'^(test_(f[36])_[A-Za-z0-9_]+)\s+\([^\n]+\)\s+\.\.\.\s+(FAIL|ERROR)$',
              output, re.MULTILINE,
          )
          failures = [(name, family) for name, family, status in cases
                      if status == 'FAIL']
          print('RED CONTROL: unittest exit =', os.environ['RED_EXIT'])
          print('RED CONTROL: BASE BEHAVIOURAL ASSERTION FAILURES:')
          for name, family in failures:
              print(f'  {family.upper()} {name}: FAIL (behaviour)')
          print('RED CONTROL: failed assertions =', len(failures))
          print('RED CONTROL: API/runner errors =', len(cases) - len(failures))
          valid = (
              int(os.environ['RED_EXIT']) != 0
              and re.search(r'^Ran 7 tests in ', output, re.MULTILINE) is not None
              and re.search(r'^FAILED \(failures=7\)$', output, re.MULTILINE) is not None
              and len(failures) == 7
              and {family for _, family in failures} == {'f3', 'f6'}
              and not re.search(r'^ERROR:', output, re.MULTILINE)
              and not any(error in output for error in (
                  'TypeError:', 'AttributeError:', 'ImportError:',
                  'SyntaxError:', 'ModuleNotFoundError:'
              ))
          )
          print('RED CONTROL VERDICT:',
                'EXPECTED BEHAVIOURAL RED' if valid else 'INVALID RED')
          if not valid:
              sys.exit(1)
          PY

      - name: Upload red-control output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp1a-base-red-output
          path: wp1a-red.log
          if-no-files-found: ignore

  wp1b-red-control:
    name: F5 behavioural red against merged WP1a main · 8 FAIL, 0 ERROR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head including F5 tests and fixtures
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore only both scripts from merged WP1a baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=59f821ff2b729ddbda00204dda629df4eaef8252
          git cat-file -e "${BASE}^{commit}"
          git show "${BASE}:scripts/fetch_live_data.py" > scripts/fetch_live_data.py
          git show "${BASE}:scripts/build_data.py" > scripts/build_data.py
          echo "WP1b_RED_BASE=${BASE} · HEAD tests and F5 fixture unchanged"
      - name: Assert eight behavioural red failures with no runtime errors
        id: f5_red
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m unittest tests.test_wp1b.BaseCompatibleF5 -v > wp1b-red.log 2>&1
          rc=$?
          set -e
          cat wp1b-red.log
          export RED_EXIT="$rc"
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          output = Path('wp1b-red.log').read_text(encoding='utf-8')
          found = re.findall(
              r'^(test_f5_[A-Za-z0-9_]+)\s+\([^\n]+\)\s+\.\.\.\s+(FAIL|ERROR)$',
              output, re.M,
          )
          failures = [name for name, verdict in found if verdict == 'FAIL']
          errors = [name for name, verdict in found if verdict == 'ERROR']
          print('F5 RED: exit', os.environ['RED_EXIT'])
          print('F5 RED: expected failing behaviours:')
          for name in failures:
              print('  F5', name, 'FAIL (projection semantics)')
          print('F5 RED: failed assertion count', len(failures))
          print('F5 RED: error count', len(errors))
          valid = (int(os.environ['RED_EXIT']) != 0 and
                   re.search(r'^Ran 8 tests in ', output, re.M) and
                   re.search(r'^FAILED \(failures=8\)$', output, re.M) and
                   len(failures) == 8 and len(errors) == 0 and
                   not re.search(r'^ERROR:', output, re.M) and
                   not any(x in output for x in (
                       'TypeError:', 'AttributeError:', 'ImportError:',
                       'SyntaxError:', 'ModuleNotFoundError:')))
          print('F5 RED VERDICT:', 'EXPECTED BEHAVIOURAL RED' if valid else
                'INVALID RED')
          if not valid:
              sys.exit(1)
          PY
      - name: Upload F5 behavioural red output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp1b-base-red-output
          path: wp1b-red.log
          if-no-files-found: error


  wp2-browser-red-control:
    name: WP2 visible behavioural red on BASE · no runner errors
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout HEAD tests and fixtures
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore only three visible files from WP2 pinned base
        shell: bash
        run: |
          set -euo pipefail
          BASE=9909cc2b05a6e1d9f67406308770b8d266c9d70a
          git cat-file -e "${BASE}^{commit}"
          git show "${BASE}:site/app.js" > site/app.js
          git show "${BASE}:site/index.html" > site/index.html
          git show "${BASE}:site/style.css" > site/style.css
          echo "WP2_RED_BASE=${BASE} · HEAD browser suite and F5 data unchanged"
      - name: Build same isolated benchmark artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _artifact
          cp -r site/. _artifact/
          python scripts/build_data.py --root . --out _artifact/data \
            --benchmark benchmarks/grade9-pilot-2026-10-15 \
            --benchmark benchmarks/imo-ab-test-2026-10-15
          python scripts/build_data.py --root . --out _artifact/data/benchmarks \
            --benchmark benchmarks/grade9-pilot-2026-10-15 \
            --benchmark benchmarks/imo-ab-test-2026-10-15
          cp -r protocol/ _artifact/protocol/
      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run new browser assertions against BASE source and require 11 expected failures
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python tests/wp2_browser_test.py _artifact > wp2-browser-red.log 2>&1
          rc=$?
          set -e
          cat wp2-browser-red.log
          export RED_EXIT="$rc"
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys
          output = Path('wp2-browser-red.log').read_text(encoding='utf-8')
          failed = re.findall(r'^FAIL (WP2_(\d\d)_[A-Za-z0-9_]+)$',
                              output, re.MULTILINE)
          got = {number for _, number in failed}
          expected = {str(i).zfill(2) for i in list(range(1, 11)) + [12]}
          counts = re.search(r'^WP2_BROWSER_COUNTS pass=\d+ fail=\d+ error=(\d+)$',
                             output, re.MULTILINE)
          print('WP2 RED: exit', os.environ['RED_EXIT'])
          print('WP2 RED: observed behaviour failures', len(failed))
          print('WP2 RED: missing expected', sorted(expected - got))
          print('WP2 RED: runner errors', counts.group(1) if counts else 'NOT_RECORDED')
          ok = (int(os.environ['RED_EXIT']) != 0 and
                len(failed) == 11 and got == expected and
                counts is not None and counts.group(1) == '0' and
                'Traceback (most recent call last)' not in output)
          print('WP2 RED VERDICT:',
                'EXPECTED BEHAVIOURAL RED' if ok else 'INVALID RED')
          if not ok:
              sys.exit(1)
          PY
      - name: Upload WP2 red browser log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp2-browser-base-red
          path: wp2-browser-red.log
          if-no-files-found: error


  wp4-red-control:
    name: WP4 base publisher behavioural red · three FAIL, zero ERROR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head and WP4 behavioural tests
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore EXACT three publisher workflows from pinned BASE
        shell: bash
        run: |
          set -euo pipefail
          BASE=5d8a586c18a3907edd3b9779b2af4a1e4a0c4ef0
          git cat-file -e "${BASE}^{commit}"
          for path in deploy.yml site-data.yml jekyll-gh-pages.yml; do
            git show "${BASE}:.github/workflows/$path" > ".github/workflows/$path"
          done
          echo "WP4_BASE=${BASE} · test source stays PR HEAD"
      - name: Demand three behavioural failures, zero missing API errors
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m unittest tests.test_wp4.BaseCompatiblePublisherTests -v \
            > wp4-red.log 2>&1
          rc=$?
          set -e
          cat wp4-red.log
          export RED_EXIT="$rc"
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          log = Path('wp4-red.log').read_text(encoding='utf-8')
          names = re.findall(
              r'^(test_wp4_[A-Za-z0-9_]+)\s+\([^\n]+\)\s+\.\.\.\s+(FAIL|ERROR)$',
              log, re.MULTILINE)
          fails = [n for n, kind in names if kind == 'FAIL']
          errors = [n for n, kind in names if kind == 'ERROR']
          expected = {
              'test_wp4_only_one_pages_publisher',
              'test_wp4_old_benchmark_snapshot_cannot_overwrite_live_projects',
              'test_wp4_failed_fetch_cannot_be_masked_as_green',
          }
          print('WP4 RED: base behavioural FAILs', len(fails))
          for n in fails:
              print('WP4 RED:', n, 'FAIL')
          print('WP4 RED: API/runner ERRORs', len(errors))
          good = (int(os.environ['RED_EXIT']) != 0 and
                  set(fails) == expected and len(fails) == 3 and
                  len(errors) == 0 and
                  re.search(r'^Ran 3 tests in ', log, re.MULTILINE) and
                  re.search(r'^FAILED \(failures=3\)$', log, re.MULTILINE) and
                  not re.search(r'^ERROR:', log, re.MULTILINE) and
                  not any(x in log for x in (
                      'TypeError:', 'AttributeError:', 'ImportError:',
                      'ModuleNotFoundError:', 'SyntaxError:')))
          print('WP4 RED VERDICT:',
                'EXPECTED BEHAVIOURAL RED' if good else 'INVALID RED')
          if not good:
              sys.exit(1)
          PY
      - name: Upload WP4 red output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp4-publisher-base-red
          path: wp4-red.log
          if-no-files-found: error

  wp3-red-control:
    name: WP3 base behavioural Python red · 4 FAIL and 0 ERROR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head (keep F4 and tests unchanged)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore BASE liveness/repository scripts and publisher
        shell: bash
        run: |
          set -euo pipefail
          BASE=5a9d0442b4e5c41300987e03d140e8405d1bfa77
          git cat-file -e "${BASE}^{commit}"
          for path in scripts/build_data.py scripts/fetch_live_data.py .github/workflows/deploy.yml; do
            git show "${BASE}:$path" > "$path"
          done
      - name: Require actual wrong behaviour on BASE with zero API errors
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m unittest tests.test_wp3.BaseCompatibleWP3 -v > wp3-red.log 2>&1
          rc=$?
          set -e
          cat wp3-red.log
          export RC="$rc"
          python - <<'PY'
          import os,re,sys
          from pathlib import Path
          lines=Path("wp3-red.log").read_text()
          tests=re.findall(r'^(test_wp3_\w+)\s+\([^\n]+\)\s+\.\.\.\s+(FAIL|ERROR)$',lines,re.M)
          fail={name for name,kind in tests if kind=="FAIL"}
          expected={
             "test_wp3_real_coordinator_receipt_is_observed",
             "test_wp3_current_epoch_evidence_header_only",
             "test_wp3_two_repositories_same_number_separate_evidence",
             "test_wp3_running_deploys_do_not_share_legacy_pages_group",
          }
          errors=sum(kind=="ERROR" for _,kind in tests)
          good=(int(os.environ["RC"])!=0 and fail==expected and errors==0
                and re.search(r'^Ran 4 tests in ',lines,re.M)
                and re.search(r'^FAILED \(failures=4\)$',lines,re.M)
                and not any(x in lines for x in ("TypeError:", "AttributeError:",
                                                 "ImportError:", "SyntaxError:",
                                                 "ModuleNotFoundError:")))
          print("WP3 RED Python FAIL count",len(fail))
          print("WP3 RED Python ERROR count",errors)
          print("WP3 RED Python VERDICT","EXPECTED BEHAVIOURAL RED" if good else "INVALID RED")
          if not good:sys.exit(1)
          PY
      - name: Upload WP3 base Python red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp3-base-python-red
          path: wp3-red.log
          if-no-files-found: error


      - name: Restore PRE-FIX WP3 liveness parser (HEAD test unchanged)
        shell: bash
        run: |
          set -euo pipefail
          OLD_HEAD=f601d7181a633755fd7e12ea976e2d48ca118282
          git cat-file -e "${OLD_HEAD}^{commit}"
          git show "${OLD_HEAD}:scripts/build_data.py" > scripts/build_data.py
          echo "FOREIGN_AUTHOR_NEGATIVE_BASE=${OLD_HEAD}"

      - name: Foreign-author spoof must fail as one assertion, zero errors
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m unittest tests.test_wp3.WP3Additional.test_wp3_foreign_author_receipt_cannot_spoof_observed -v > wp3-author-red.log 2>&1
          rc=$?
          set -e
          cat wp3-author-red.log
          export RC="$rc"
          python - <<'PY'
          import os,re,sys
          from pathlib import Path
          out=Path('wp3-author-red.log').read_text()
          names=re.findall(r'^(test_wp3_\w+)\s+\([^\n]+\)\s+\.\.\.\s+(FAIL|ERROR)$',out,re.M)
          fails=[name for name,kind in names if kind=='FAIL']
          errors=[name for name,kind in names if kind=='ERROR']
          expected='test_wp3_foreign_author_receipt_cannot_spoof_observed'
          good=(int(os.environ['RC']) != 0 and fails == [expected] and not errors
                and re.search(r'^Ran 1 test in ',out,re.M)
                and re.search(r'^FAILED \(failures=1\)$',out,re.M)
                and 'AssertionError:' in out
                and not any(x in out for x in (
                    'TypeError:','AttributeError:','ImportError:',
                    'ModuleNotFoundError:','SyntaxError:')))
          print('WP3 AUTHOR RED: behavioural FAIL count',len(fails))
          print('WP3 AUTHOR RED: runner ERROR count',len(errors))
          print('WP3 AUTHOR RED VERDICT',
                'EXPECTED BEHAVIOURAL RED' if good else 'INVALID RED')
          if not good:sys.exit(1)
          PY

      - name: Upload WP3 author spoof red proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp3-author-spoof-old-head-red
          path: wp3-author-red.log
          if-no-files-found: error

  wp3-browser-red-control:
    name: WP3 browser polling behavioural red · 4 FAIL and 0 ERROR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact head tests
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore only BASE app.js, retain HEAD browser tests
        run: |
          set -euo pipefail
          BASE=5a9d0442b4e5c41300987e03d140e8405d1bfa77
          git show "${BASE}:site/app.js" > site/app.js
      - name: Build synthetic benchmark browser artifact
        run: |
          set -euo pipefail
          mkdir -p _artifact
          cp -r site/. _artifact/
          rm -rf _artifact/data
          python scripts/build_data.py --root . --out _artifact/data \
            --benchmark benchmarks/grade9-pilot-2026-10-15 \
            --benchmark benchmarks/imo-ab-test-2026-10-15
          python scripts/build_data.py --root . --out _artifact/data/benchmarks \
            --benchmark benchmarks/grade9-pilot-2026-10-15 \
            --benchmark benchmarks/imo-ab-test-2026-10-15
          cp -r protocol/. _artifact/protocol/
      - name: Install Chromium
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Require polling assertions fail on BASE, no runner errors
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python tests/wp3_browser_test.py _artifact > wp3-browser-red.log 2>&1
          rc=$?
          set -e
          cat wp3-browser-red.log
          export RC="$rc"
          python - <<'PY'
          import os,re,sys
          from pathlib import Path
          lines=Path("wp3-browser-red.log").read_text()
          failed=set(re.findall(r'^FAIL (WP3_UI_0[1-4]_\w+)$',lines,re.M))
          error=re.search(r'^WP3_BROWSER_COUNTS pass=(\d+) fail=(\d+) error=(\d+)$',lines,re.M)
          good=(int(os.environ["RC"])!=0 and len(failed)==4 and error
                and error.group(2)=="4" and error.group(3)=="0"
                and "Traceback (most recent call last)" not in lines)
          print("WP3 RED browser behavioural FAIL count",len(failed))
          print("WP3 RED browser ERROR count",error.group(3) if error else "MISSING")
          print("WP3 RED browser VERDICT","EXPECTED BEHAVIOURAL RED" if good else "INVALID RED")
          if not good:sys.exit(1)
          PY
      - name: Upload WP3 browser base red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp3-base-browser-red
          path: wp3-browser-red.log
          if-no-files-found: error
