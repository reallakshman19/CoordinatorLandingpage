name: Build site data and deploy to Pages

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued.  Cancel in-progress runs since we
# always want the most up-to-date deployment.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write   # needed to commit site/data/ back to the branch
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feat/landing-page
        uses: actions/checkout@v4
        with:
          ref: feat/landing-page
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build site data from live repo
        run: |
          python scripts/build_data.py \
            --root . \
            --out site/data

      - name: Build benchmark data
        run: |
          python scripts/build_data.py \
            --root . \
            --out site/data/benchmarks \
            --benchmark benchmarks/grade9-pilot-2026-10-15 \
            --benchmark benchmarks/imo-ab-test-2026-10-15

      - name: Run hard-case tests
        run: python tests/build_test.py

      - name: Commit updated site/data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/
          git diff --cached --quiet || git commit -m "chore: rebuild site data [skip ci]"
          git push origin feat/landing-page || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
