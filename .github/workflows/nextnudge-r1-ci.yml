name: NextNudge R1 steering qualification
on:
  pull_request:
    paths:
      - 'site/nextnudge/**'
      - 'site/nextnudge-data/threads/**'
      - 'scripts/nextnudge_thread_apply.mjs'
      - 'tests/nextnudge-*.mjs'
      - '.github/workflows/nextnudge-thread-save.yml'
      - '.github/workflows/nextnudge-r1-ci.yml'
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ALL v2 compatibility and v3 steering tests (fail closed)
        run: node --test tests/nextnudge-*.mjs
